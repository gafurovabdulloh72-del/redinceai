  const T = canvasTex(1024, 256); const g = T.g; g.font = '700 150px SG'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(255,160,90,.9)'; g.shadowBlur = 30; g.fillStyle = '#fff3e2'; g.fillText(w.text, 512, 128); T.t.needsUpdate = true;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: T.t, transparent: true, depthWrite: false, opacity: 0 }));
  sp.position.set(...w.pos); const s = w.size || .5; sp.scale.set(s, s / 4, 1); scene.add(sp); return { sp, w, base: sp.position.clone(), s };
});

// --- chang
const N = 700, pos = new Float32Array(N * 3), seed = new Float32Array(N);
for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - .5) * 2.6; pos[i * 3 + 1] = .8 + Math.random() * 1.4; pos[i * 3 + 2] = -.6 + Math.random() * 1.8; seed[i] = Math.random() * 100; }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(pos.slice(), 3));
const dot = canvasTex(32, 32); { const gr = dot.g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,230,190,1)'); gr.addColorStop(1, 'rgba(255,230,190,0)'); dot.g.fillStyle = gr; dot.g.fillRect(0, 0, 32, 32); dot.t.needsUpdate = true; }
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: .012, map: dot.t, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: C.minimal ? .45 : .8 }));
scene.add(dust);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .3, .55, .9));
composer.addPass(new OutputPass());

// --- overlay
const ov = document.getElementById('ov');
ov.innerHTML = (C.caps || []).map(c => `<div class="cap${c.small ? ' small' : ''}" style="top:${c.top}px">${c.html}</div>`).join('') +
  `<div id="end"><div class="logo"><div class="tile">k</div>kasb egalari</div><h2>${C.endTitle || 'Bepul profil<br><b>1 daqiqada</b>'}</h2><div class="pill">@kasb_egalari_bot</div><div class="sub">📢 @kasb_egalari</div></div>`;
const endEl = document.getElementById('end');

const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const L3 = (a, b, e) => new THREE.Vector3(a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e);

window.renderAt = (t) => {
  const shots = C.shots; let sh = shots[shots.length - 1];
  for (const s of shots) if (t >= s.s && t < s.e) { sh = s; break; }
  const e = ease(clamp((t - sh.s) / (sh.e - sh.s)));
  camera.position.copy(L3(sh.from, sh.to, e)); camera.lookAt(L3(sh.lf, sh.lt, e));
  camera.fov = sh.fov || 34; camera.updateProjectionMatrix();
  drawScreen(t);
  const p = dust.geometry.attributes.position;
  for (let i = 0; i < N; i++) { const s = seed[i]; p.array[i * 3] = pos[i * 3] + Math.sin(t * .4 + s) * .04; p.array[i * 3 + 1] = pos[i * 3 + 1] + Math.sin(t * .25 + s * 1.7) * .05; p.array[i * 3 + 2] = pos[i * 3 + 2] + Math.cos(t * .3 + s) * .04; }
  p.needsUpdate = true;
  flick.forEach(L => L.intensity = 6 + Math.sin(t * 9) * .1);
  words.forEach(o => { const a = clamp((t - o.w.in) / .5) * clamp((o.w.out - t) / .5); const pop = 1 - Math.pow(1 - clamp((t - o.w.in) / .6), 3);
    o.sp.material.opacity = a; o.sp.position.set(o.base.x, o.base.y + Math.sin(t * 1.3 + o.base.x * 3) * .015 + (1 - pop) * -.08, o.base.z); o.sp.scale.set(o.s * (.7 + .3 * pop), o.s / 4 * (.7 + .3 * pop), 1); });
  (C.caps || []).forEach((c, i) => { const el = ov.children[i]; const a = clamp((t - c.in) / .3) * clamp((c.out - t) / .3); el.style.opacity = a; el.style.transform = `translateY(${(1 - clamp((t - c.in) / .45)) * 26}px)`; });
  const ea = clamp((t - (DUR - 3.2)) / .5); endEl.style.opacity = ea; endEl.style.transform = `scale(${1.04 - .04 * ea})`;
  composer.render();
};
document.fonts.ready.then(() => { window.ready = true; });
</script></body></html>
