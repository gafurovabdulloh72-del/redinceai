<script>
const W=1080,H=1920,PI=Math.PI;
const cl=x=>x<0?0:x>1?1:x, pr=(t,a,d)=>cl((t-a)/d);
const eo=x=>x>=1?1:1-Math.pow(2,-10*x), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eoq=x=>1-Math.pow(1-x,4);
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const $=id=>document.getElementById(id);
const EVENTS=[];const ev=(t,type,x)=>EVENTS.push(Object.assign({t:+t.toFixed(3),type},x||{}));
function el(tag,css,parent,html){const e=document.createElement(tag);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||$('root')).appendChild(e);return e}
let fid=0;function mbF(){const id='mb'+(fid++);const f=document.createElementNS('http://www.w3.org/2000/svg','filter');f.setAttribute('id',id);
  f.setAttribute('x','-60%');f.setAttribute('y','-60%');f.setAttribute('width','220%');f.setAttribute('height','220%');
  const g=document.createElementNS('http://www.w3.org/2000/svg','feGaussianBlur');g.setAttribute('stdDeviation','0 0');f.appendChild(g);$('defs').appendChild(f);
  return {css(x,y){g.setAttribute('stdDeviation',`${x.toFixed(2)} ${y.toFixed(2)}`);return (x>.25||y>.25)?`url(#${id})`:'none'}}}
function popS(p){if(p<=0)return 0;if(p>=1)return 1;const k=[[0,0],[.45,1.16],[.75,.96],[1,1]];for(let i=1;i<k.length;i++)if(p<=k[i][0]){const a=k[i-1],b=k[i];return lerp(a[1],b[1],eio((p-a[0])/(b[0]-a[0])))}return 1}
function fitText(e,maxW,maxSize){let s=maxSize;e.style.fontSize=s+'px';while(e.offsetWidth>maxW&&s>20){s-=4;e.style.fontSize=s+'px'}return s}
// masked satr: pastdan ko'tariladi
function maskIn(span,t,st,d=.55){const e=eo(pr(t,st,d));span.style.transform=`translateY(${(105*(1-e)).toFixed(2)}%)`}
const STYLE=(window.CFG&&CFG.style)||'A';let S={dur:10,render(){}};

// ======================= A — KINETIK TIPOGRAFIYA =======================
function styleA(){
  const INK='#111',CR='#fafaf7',CO='#ff5a36';$('root').style.background=CR;
  const bg=el('div','position:absolute;inset:0;background:'+CR);
  const wordBox=el('div','position:absolute;left:0;top:50%;width:100%;text-align:center');const word=el('span','display:inline-block;font-family:Arc;font-weight:900;font-stretch:112%;line-height:.9;white-space:nowrap;transform-origin:50% 50%',wordBox);
  const WORDS=[['HAR',.25],['BIR',.62],['KASB',.99,1],['EGASI',1.42],['UCHUN',1.82]];const WS={};
  // sanoq
  const num=el('div','position:absolute;left:0;width:100%;top:520px;text-align:center;font-family:Arc;font-weight:900;font-stretch:100%;font-size:640px;line-height:1;color:'+INK);
  const lab=el('div','position:absolute;left:0;width:100%;top:1250px;text-align:center;font-family:Arc;font-weight:800;font-stretch:112%;font-size:130px;line-height:1;color:'+INK);
  const labA=el('span','display:inline-block;margin-right:.32em',lab,'XIL'),labB=el('span','display:inline-block;color:'+CO,lab,'KASB');

  const LIST=['VIDEOGRAF','FOTOGRAF','GRAFIK DIZAYNER','MOTION DIZAYNER','DRONOGRAF','KOLORIST','MARKETOLOG','2D ANIMATOR','REELS YARATUVCHI','UI/UX DIZAYNER','KOPIRAYTER','MONTAJOR'];
  const tape=el('div','position:absolute;left:0;top:0;width:100%');const LH=150;

  const bar=el('div',`position:absolute;left:70px;right:70px;top:${960-LH/2}px;height:${LH}px;border:5px solid ${CO};border-radius:22px;box-sizing:border-box`);

  const e2=el('div','position:absolute;left:0;width:100%;top:1060px;text-align:center;font-family:SG;font-weight:600;font-size:52px;color:'+INK,null,'kasbegalari.vercel.app');
  const e3=el('div','position:absolute;left:0;width:100%;top:1150px;text-align:center;font-family:JBM;font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:30px;color:#777',null,'Telegram · kasb_egalari_bot');
  const wF=mbF(),tF=mbF();
  WORDS.forEach(([w,t,acc])=>{ev(t,'click',{g:.75,ping:acc?1200:1700});if(acc)ev(t,'impact',{g:.45})});
  ev(.05,'bed',{bpm:100});ev(2.25,'whoosh',{g:.5});{let tt=2.4,dt=.1;while(tt<3.25){ev(tt,'tick');tt+=dt;dt=Math.max(.04,dt*.88)}}ev(3.3,'impact',{g:1});ev(3.45,'click',{g:.6});ev(3.65,'click',{g:.6});
  ev(5.15,'whip',{g:.8});for(let i=0;i<LIST.length;i++){ev(5.35+2.6*Math.pow(i/(LIST.length-1),2.2),'tick',{k:i/12})}ev(8.05,'pop',{g:.8});
  ev(8.6,'whoosh',{g:.6});ev(8.75,'click',{g:.6});ev(9.0,'click',{g:.6});ev(9.6,'ding',{g:.7,root:261.6});
  return {dur:11.6,render(t){
    // 1) so'zlar
    let cur=null;for(const w of WORDS)if(t>=w[1])cur=w;
    const inWords=t<2.25;wordBox.style.display=inWords&&cur?'block':'none';
    if(inWords&&cur){word.textContent=cur[0];fitText(word,960,420);const p=pr(t,cur[1],.22),e=eo(p);
      word.style.transform=`translateY(-50%) scale(${lerp(1.38,1,e).toFixed(4)}) rotate(${lerp(cur[2]?-4:3,0,e).toFixed(2)}deg)`;
      word.style.color=cur[2]?CR:INK;word.style.filter=wF.css(0,(1-e)*22)}
    bg.style.background=(inWords&&cur&&cur[2])?CO:(t>=3.3&&t<3.38?INK:CR);
    // 2) sanoq
    const inC=t>=2.25&&t<5.2;num.style.display=lab.style.display=inC?'block':'none';
    if(inC){const v=Math.round(94*eoq(pr(t,2.35,.95)));num.textContent=v;const z=t>3.3?1+.04*Math.exp(-(t-3.3)*6):lerp(.82,1,eo(pr(t,2.25,.4)));

      [labA,labB].forEach((s,i)=>{const e=eo(pr(t,3.45+i*.2,.3));s.style.opacity=e;s.style.transform=`translateY(${(60*(1-e)).toFixed(1)}px) scale(${lerp(1.3,1,e).toFixed(3)})`})}
    // 3) tasma
    const inT=t>=5.15&&t<8.6;tape.style.display=bar.style.display=inT?'block':'none';
    if(inT){const p=eoq(pr(t,5.25,2.8)),p2=eoq(pr(t+1/60,5.25,2.8));const idx=p*(LIST.length-1),v=Math.abs(p2-p)*60*(LIST.length-1)*LH;
      rows.forEach((r,i)=>{const y=960+(i-idx)*LH-LH/2;r.style.top=y+'px';const d=Math.abs(i-idx);r.style.opacity=Math.max(0,1-d*.32).toFixed(3);
        r.style.color=(d<.5&&i===LIST.length-1&&p>.98)?CO:INK;r.style.transform=`scale(${(1-Math.min(.25,d*.08)).toFixed(3)})`});
      tape.style.filter=tF.css(0,Math.min(18,v*.006));const bs=popS(pr(t,8.0,.45));bar.style.transform=`scale(${(lerp(1,1.04,bs>1?bs-1:0)).toFixed(3)})`;bar.style.opacity=eo(pr(t,5.2,.3))}
    // 4) yakun
    const inE=t>=8.6;[e1,e2,e3].forEach(x=>x.style.display=inE?'block':'none');
    if(inE){e1.querySelectorAll('.lw>span').forEach((s,i)=>maskIn(s,t,8.7+i*.25));[e2,e3].forEach((x,i)=>{const e=eo(pr(t,9.3+i*.2,.5));x.style.opacity=e;x.style.transform=`translateY(${(20*(1-e)).toFixed(1)}px)`})}
  }};
}

  const cta=el('div','position:absolute;left:0;width:100%;top:1500px;text-align:center;font-family:SG',null,`<div style="font-weight:700;font-size:64px;color:${INK}">kasbegalari.vercel.app</div><div style="font-family:JBM;font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:28px;color:#7a6e68;margin-top:18px">ro'yxatdan o'tish · Telegram kasb_egalari_bot</div>`);
  const pF=mbF(),tF=mbF();const SW=[2.7,5.1,7.5];
  ev(.05,'bed',{bpm:104});ev(.25,'whoosh',{g:.7});ev(.4,'pop',{g:.4});SW.forEach(s=>{ev(s-.35,'click',{g:.7,ping:1500});ev(s,'whoosh',{g:.5})});
  [1.3,3.4,5.8,8.2].forEach(s=>ev(s,'pop',{g:.65}));ev(9.7,'whoosh',{g:.55});ev(10.1,'ding',{g:.7,root:220});

// ======================= D — RETRO JURNAL =======================
function styleD(){
  const PA='#efe5cf',INK='#2a1f17',RED='#b8372a';$('root').style.background=PA;
  const cv=el('canvas','position:absolute;inset:0;width:1080px;height:1920px');cv.width=540;cv.height=960;
